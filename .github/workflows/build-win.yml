# Build Windows — 云端 Windows 自动打包，Mac 上只管 push 代码
# 产物：绿色免安装 zip（必出）+ NSIS 安装器（可选，失败不阻断）
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller win_app.spec --noconfirm --clean --distpath dist --workpath build

      - name: 打包绿色版 zip（必出）
        run: |
          cd dist
          Compress-Archive -Path 证件照工作室 -DestinationPath ../证件照工作室_Win绿色版.zip
          cd ..

      - name: 上传绿色版 zip
        uses: actions/upload-artifact@v4
        with:
          name: 证件照工作室-Win绿色版
          path: 证件照工作室_Win绿色版.zip

      - name: 安装 NSIS（可选）
        continue-on-error: true
        run: choco install nsis -y

      - name: 封装安装器（可选，失败不阻断）
        continue-on-error: true
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) { & $nsis build_win.nsi } else { & makensis build_win.nsi }

      - name: 上传安装器（若有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 证件照工作室-Win安装器
          path: 证件照工作室_Setup.exe
          if-no-files-found: ignore
