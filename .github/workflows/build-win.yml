# Build Windows — 云端 Windows 自动打包，Mac 上只管 push 代码
# 产物：绿色免安装 zip（必出）+ NSIS 安装器（可选，失败不阻断）
#
# 关键保障：打包完成后硬性校验权重与 onnxruntime 已打进包，
# 缺失则直接构建失败（exit 1），绝不再产出"空壳包"（即换背景失效的废片）。
name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: PyInstaller 打包
        run: pyinstaller win_app.spec --noconfirm --clean --distpath dist --workpath build

      - name: 硬校验 + 改名 + 打印清单
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $src = "dist\证件照工作室"

          # 1) 权重必须打进包（否则换背景功能完全失效）
          # 注意：PyInstaller 6+ onedir 把所有 datas 打进 _internal/ 子目录，
          # 故权重实际位于 <根>/_internal/weights/，而非顶层 weights/。
          $weights = @("rmbg_quantized.onnx","hivision_modnet.onnx","modnet_photographic_portrait_matting.onnx")
          foreach ($w in $weights) {
            $p = Join-Path $src "_internal\weights\$w"
            if (-not (Test-Path $p)) { Write-Error "[FATAL] 缺失权重: $p —— 打包配置异常，禁止产出空壳包"; exit 1 }
            $sz = (Get-Item $p).Length
            Write-Host "OK  weights/$w  size=$sz"
          }

          # 2) onnxruntime 必须打进包（否则无法抠图）
          $ortdir = Join-Path $src "_internal\onnxruntime"
          if (-not (Test-Path $ortdir)) { Write-Error "[FATAL] 缺失 onnxruntime 目录 —— 打包配置异常，禁止产出"; exit 1 }
          Write-Host "OK  onnxruntime 目录存在"

          # 3) 打印 ORT 版本（须与 Mac 验证版 1.27.0 一致）
          python -c "import onnxruntime as o; print('ORT_VERSION='+o.__version__)"

          # 4) 重命名为 ASCII，避免 zip 内中文路径乱码导致解压异常
          Move-Item $src "dist\IDPhotoStudio"
          Rename-Item "dist\IDPhotoStudio\证件照工作室.exe" "IDPhotoStudio.exe"
          Write-Host "已重命名为 ASCII 输出: IDPhotoStudio"

      - name: 打包绿色版 zip（必出）
        shell: pwsh
        run: |
          cd dist
          Compress-Archive -Path IDPhotoStudio -DestinationPath ..\证件照工作室_Win绿色版.zip -Force
          cd ..

      - name: 上传绿色版 zip
        uses: actions/upload-artifact@v4
        with:
          name: 证件照工作室-Win绿色版
          path: 证件照工作室_Win绿色版.zip

      - name: 安装 NSIS（可选）
        continue-on-error: true
        run: choco install nsis -y

      - name: 封装安装器（可选，失败不阻断）
        continue-on-error: true
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $nsis) { & $nsis build_win.nsi } else { & makensis build_win.nsi }

      - name: 上传安装器（若有）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 证件照工作室-Win安装器
          path: 证件照工作室_Setup.exe
          if-no-files-found: ignore
